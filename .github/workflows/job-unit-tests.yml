# Reusable job: real unit tests (go test, stdlib only) for both services.
# Produces the REAL test-{api,worker}.json that VBBI folds in as the
# "unit-tests" step, and gates the build (build-push-* depend on it).
# _test.go files never enter the image, so the distroless SBOM stays clean.
name: job-unit-tests

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (StepSecurity)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run unit tests (api + worker)
        run: |
          set +e
          ( cd services/api && go test ./... ); rc_api=$?
          ( cd services/worker && go test ./... ); rc_worker=$?
          set -e
          emit() {
            local svc="$1" rc="$2" st=0
            [ "$rc" -eq 0 ] || st=1
            printf '{"exit_code":%d,"framework":"go-test","service":"%s"}' "$st" "$svc"
          }
          emit api "$rc_api" > /tmp/test-api.json
          emit worker "$rc_worker" > /tmp/test-worker.json
          cat /tmp/test-api.json /tmp/test-worker.json
          # Gate: fail if either service had a failing test.
          [ "$rc_api" -eq 0 ] && [ "$rc_worker" -eq 0 ]
      - uses: actions/upload-artifact@v4
        with: { name: vbbi-test-api, path: /tmp/test-api.json }
      - uses: actions/upload-artifact@v4
        with: { name: vbbi-test-worker, path: /tmp/test-worker.json }
